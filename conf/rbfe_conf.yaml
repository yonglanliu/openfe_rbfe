# SepTop protocol configuration template
# Fill in the values to match your system and workflow.

# --- Input file ---
ligand_sdf: simulation/rbfe/inputs/charged_ligands.sdf 
protein_pdb: simulation/rbfe/inputs/protein.pdb
cofactor_sdf: null
input_json_files: null  # Options: "null", .txt, list
                        # 1. if it is null, will run json file in json_dir
                        # 2. if it is a .txt file, run json file list in the .txt file
                        # 3. if it is a list, run the specific json files in this list

# --- Out ---
workdir: simulation/rbfe
result_dir: simulation/rbfe/results
json_dir: simulation/rbfe/json

# Options: "null", .txt, list
# 1. if it is null, will run json file in json_dir
# 2. if it is a .txt file, run json file list in the .txt file
# 3. if it is a list, run the specific json files in this list
input_json_files: null
restart: false

# --- Alchemical Network ---
alchemical_network: all    # all or [ligand_a, ligand_b]
transformation: both   # both, complex, solvent

# --- Platform ---
platform: CUDA

# --- Membrane or not ---
membrane_system: false

# --- General ---
solvent_protocol_repeats: 1
complex_protocol_repeats: 1
pressure: 1.0              # bar
temperature: 310.0         # kelvin

# --- Force field / nonbonded ---
ff_constraints: hbonds
nonbonded_cutoff: 1.0      # nanometer
nonbonded_method: PME      # e.g. PME, CutoffNonPeriodic, CutoffPeriodic
rigid_water: true
small_molecule_forcefield: openff-2.1.0
hydrogen_mass: 3.0        # dalton

# --- Partial charges ---
off_toolkit_backend: ambertools  # e.g. openeye, rdkit, ambertools
partial_charge_method: am1bcc  # am1bcc or nagl

# --- Alchemical settings ---
endstate_dispersion_correction: false
explicit_charge_correction: true
explicit_charge_correction_cutoff: 0.8  # nanometer
softcore_LJ: gapsys
softcore_alpha: 0.85
turn_off_core_unique_exceptions: false
use_dispersion_correction: true
n_lambda_windows_solvent_leg: 30
n_lambda_windows_complex_leg: 30

# --- Solvation settings ---
# Used when membrane_system is false
complex_solvation_padding: 1.5    # nanometer
solvent_solvation_padding: 1.5    # nanometer

# Used when membrane_system is true
# complex_box_size should be a list [x, y, z] in nanometers
complex_box_size: null

# Used for both complex and solvent
solvent_model: tip3p

# --- Simulation settings ---
early_termination_target_error: 0.0   # kilocalorie_per_mole
complex_sim_mini_step: 5000
complex_sim_equil_length: 5.0         # nanosecond
complex_sim_prod_length: 30.0          # nanosecond

solvent_sim_mini_step: 5000
solvent_sim_equil_length: 2.0         # nanosecond
solvent_sim_prod_length: 30.0         # nanosecond

# --- Integrator settings ---
complex_timestep: 4.0   # femtosecond
solvent_timestep: 4.0   # femtosecond
barostat_frequency: 25.0  # timestep
surface_tension: 300.0  # bar * nanometer

# --- Mapper and planner----
mapper: KartografAtomMapper  # LomapAtomMapper, KartografAtomMapper
planner: minimal_redundant  # minimal_spanning, minimal_redundant, radial]
